services:
  - type: web
    name: chatbox-api
    env: docker
    region: singapore
    plan: free
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: localhost
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000
      - key: FRONTEND_URL
        value: http://localhost:3000
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_LIFETIME
        value: "1"
      - key: REFRESH_TOKEN_LIFETIME
        value: "7"
      - key: DATABASE_URL
        fromDatabase:
          name: chatbox-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
databases:
  - name: chatbox-db
    plan: free
